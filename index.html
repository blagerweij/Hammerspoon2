<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hammerspoon 2 — API Documentation</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            font-size: 14px;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 640px;
            padding: 2rem;
        }
        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: #e6edf3;
            margin-bottom: 0.25rem;
        }
        .subtitle {
            color: #8b949e;
            font-size: 0.9375rem;
            margin-bottom: 2rem;
        }
        .section-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #8b949e;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }
        .version-section + .version-section {
            margin-top: 1.75rem;
        }
        .section-note {
            color: #8b949e;
            font-size: 0.8125rem;
            margin: -0.375rem 0 0.75rem;
        }
        .version-section.latest .version-list li {
            border-color: rgba(88, 166, 255, 0.45);
        }
        .version-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .version-list li {
            padding: 0.75rem 1rem;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
        }
        .version-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 0.5rem 1rem;
        }
        .version-name {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.9375rem;
            color: #e6edf3;
            white-space: nowrap;
        }
        .version-links {
            display: flex;
            flex-shrink: 0;
            gap: 0.5rem;
        }
        .version-links a {
            padding: 0.25rem 0.625rem;
            background: rgba(31, 111, 235, 0.1);
            border: 1px solid rgba(88, 166, 255, 0.25);
            border-radius: 5px;
            color: #58a6ff;
            text-decoration: none;
            font-size: 0.8125rem;
            transition: border-color 0.15s, background 0.15s;
        }
        .version-links a:hover {
            background: rgba(31, 111, 235, 0.2);
            border-color: #58a6ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Hammerspoon 2</div>
        <p class="subtitle">API Documentation</p>
        <section class="version-section developer">
            <h2 class="section-label">Developer</h2>
            <p class="section-note">Built from the latest commit on the main branch</p>
            <ul class="version-list">
                <li>
                    <div class="version-row">
                        <span class="version-name">main</span>
                        <div class="version-links">
                            <a href="main/js/">JavaScript API</a>
                            <a href="main/ts/">TypeScript</a>
                        </div>
                    </div>
                </li>
            </ul>
        </section>
    </div>
</body>
</html>
