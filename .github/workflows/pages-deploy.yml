name: Deploy GitHub Pages

# Deploys the gh-pages branch to GitHub Pages exactly as it is.
#
# `scripts/release/release.sh execute` runs this after pushing a new signed
# appcast.xml to gh-pages. The feed is signed with the Sparkle EdDSA key, which
# never leaves the release manager's Mac, so nothing here may change it.
# (publish-docs.yml deploys gh-pages too, keeping appcast.xml as it is.)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shares a group with publish-docs.yml: both deploy Pages from gh-pages, so
# they must not interleave.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
